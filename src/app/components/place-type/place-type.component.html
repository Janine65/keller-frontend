<div style="height: 100%;">
  @if (!isLoading) {
    <p-table dataKey="id" editMode="row" [value]="lPlacetypes" [scrollable]="true"
      scrollHeight="flex">
      <ng-template pTemplate="caption">
        <button pButton pRipple label="New" icon="pi pi-plus" class="p-button-success mr-2"
        (click)="onRowNew()"></button>
        <button pButton pRipple label="Close" icon="pi pi-sign-out" class="p-button-secondary mr-2"
        (click)="onClose()"></button>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Icon</th>
          <th style="width:4em"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-placetype let-editing="editing" let-ri="rowIndex">
        <tr [pEditableRow]="placetype">
          <td>
            <p-celleditor>
              <ng-template pTemplate="input">
                <input pInputText type="text" [(ngModel)]="placetype.name">
              </ng-template>
              <ng-template pTemplate="output">
                {{placetype.name}}
              </ng-template>
            </p-celleditor>
          </td>
          <td>
            <p-celleditor>
              <ng-template pTemplate="input">
                <p-select [options]="lIcons" [showClear]="true" [(ngModel)]="placetype.icon"
                  [style]="{'width':'100%'}" appendTo="body">
                  <ng-template pTemplate="selectedItem">
                    @if (placetype.icon) {
                      <div class="flex items-center gap-2">
                        <fa-icon [icon]="['fas', placetype.icon]"></fa-icon> {{placetype.icon}}
                      </div>
                    }
                  </ng-template>
                  <ng-template let-icons pTemplate="item">
                    <div class="flex items-center gap-2">
                      <fa-icon [icon]="['fas',icons.icon]"></fa-icon>
                      <div>{{ icons.label }}</div>
                    </div>
                  </ng-template>
                </p-select>
              </ng-template>
              <ng-template pTemplate="output">
                <fa-icon [icon]="['fas', placetype.icon]"></fa-icon> {{placetype.icon}}
              </ng-template>
            </p-celleditor>
          </td>
          <td>
            <div class="flex items-center justify-center gap-2">
              @if (!editing) {
                <button pButton pRipple type="button" pInitEditableRow icon="pi pi-pencil"
                (click)="onRowEditInit(placetype)" class="p-button-rounded p-button-text"></button>
              }
              @if (!editing && placetype.id > 0) {
                <button pButton pRipple type="button" icon="pi pi-trash"
                (click)="onRowDelete(placetype, ri)" class="p-button-rounded p-button-text"></button>
              }
              @if (editing) {
                <button pButton pRipple type="button" pSaveEditableRow icon="pi pi-check"
                  (click)="onRowEditSave(placetype, ri)"
                class="p-button-rounded p-button-text p-button-success mr-2"></button>
              }
              @if (editing) {
                <button pButton pRipple type="button" pCancelEditableRow icon="pi pi-times"
                  (click)="onRowEditCancel(placetype, ri)"
                class="p-button-rounded p-button-text p-button-danger"></button>
              }
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="summary">
        <hr />
        {{lPlacetypes.length}} Placetypes
      </ng-template>
    </p-table>
  }
</div>
