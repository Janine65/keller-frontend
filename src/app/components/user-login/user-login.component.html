<div class="bg-surface-0 p-6 shadow-md rounded-md w-full lg:w-1/3">
    <form (ngSubmit)="onLogin()" [formGroup]="loginForm">

        <div class="text-center mb-8">
            <img src="assets/favicon.png" alt="Keller Organizer" class="mb-4 h-[50px] w-auto mx-auto rounded">
            <div class="text-surface-900 text-3xl font-medium mb-4">Welcome Back</div>
        </div>
        <div>
            <label for="logon" class="block text-surface-900 font-medium mb-2">Login</label>
            <input id="logon" type="text" formControlName="login" required pInputText
                class="w-full mb-4">
            <div [hidden]="loginForm.controls['login'].valid || !loginForm.controls['login'].dirty"
                class="alert alert-danger">
                Login is required
            </div>

            <label for="password" class="block text-surface-900 font-medium mb-2">Password</label>
            <p-password id="password" formControlName="password" [toggleMask]="true" required
                class="mb-4" [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}"></p-password>
            <div [hidden]="loginForm.controls['password'].valid || !loginForm.controls['password'].dirty"
                class="alert alert-danger">
                Password is required
            </div>
        </div>
        <div class="mt-4">
            <button pButton pRipple type="submit" [disabled]="loading"
                class="p-button-primary p-button-outlined p-2 mr-6">
                Login
            </button>
            <button pButton pRipple type="reset" [disabled]="loading" class="p-button-secondary p-button-outlined p-2"
                (click)="onReset()">
                Reset
            </button>
        </div>
    </form>
</div>
