<h1>Users</h1>
<div style="height: 100%;">
  @if (!isLoading) {
    <p-table dataKey="id" [value]="lUsers" [scrollable]="true" scrollHeight="flex">
      <ng-template #caption>
        <button pButton pRipple class="mr-2"
        (click)="doRegister()"><i class="pi pi-plus" pButtonIcon></i><span pButtonLabel>New</span></button>
      </ng-template>
      <ng-template #header>
        <tr>
          <th style="width:30%">Name </th>
          <th style="width:30%">Email </th>
          <th  style="width:20%">Login</th>
          <th style="width:20%">Last updated </th>
          <th style="width:20%">Last User </th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-user>
        <tr [pSelectableRow]="selUser">
          <td>
            {{user.name}}
          </td>
          <td>
            {{user.email}}
          </td>
          <td>
            {{user.login}}
          </td>
          <td>
            {{user.updatedAt | stringDate: 'd. MMMM yyyy HH:mm' }}
          </td>
          <td>
            {{user.user}}
          </td>
          <td>
            <div class="flex items-center justify-center gap-2">
              <button pButton pRipple type="button" (click)="doDelete(user)"
              class="p-button-rounded p-button-text"><i class="pi pi-trash" pButtonIcon></i></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #summary>
        <hr />
        {{lUsers.length}} Things
      </ng-template>
    </p-table>
  }
</div>
